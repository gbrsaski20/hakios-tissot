# devices/tissot/device.conf: what this device repository is (docs/porting/repositories.md has every word).
#
# Nothing of this port has been run on the phone. Every status below is therefore `missing`:
# `works` and `partial` are for what has been seen on the device (docs/porting/index.md, step 4).

device tissot
	title       Xiaomi Mi A1
	vendor      Xiaomi
	soc         msm8953
	defconfig   tissot_defconfig
	maintainer  gbrsaski20 (draft port, nothing tested on hardware)
	status      display     missing   no UEFI port for tissot exists yet (the loader needs UEFI's framebuffer); nothing tried
	status      touch       missing   panel IC and FocalTech FT5435 per the Linux DTS, not checked here; no driver
	status      storage     missing   eMMC (sdhci), per the Linux DTS; the common storage driver is UFS only
	status      cpu         missing   8x Cortex-A53 per the Linux DTS; no cpufreq or SMP bring-up tried
	status      gpu         missing   Adreno 506; the common driver and hakios-metal's tables are for the Adreno 642L only
