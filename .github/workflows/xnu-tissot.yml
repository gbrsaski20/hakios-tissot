name: xnu-tissot

# ============================================================================
# Build XNU 8020 (iOS 15) untuk Xiaomi Mi A1 — tissot / MSM8953 / Cortex-A53.
#
# TENTANG macOS — baca ini dulu:
#
#   Target workflow ini adalah Mi A1 (ARM64 Android), BUKAN macOS.
#   macOS muncul di sini hanya sebagai MESIN BUILD, karena XNU adalah kernel
#   Apple dan build system-nya butuh clang + cctools (ld yang paham Mach-O,
#   ctf_insert, kextsymboltool) + SDK Apple, dengan makefile yang berasumsi
#   userland BSD/macOS. Itu persyaratan host dan tidak berubah berapa pun
#   targetnya. Proyek pembanding dipa-studio/ios-sweet juga membangun
#   kernelnya di runner macOS.
#
#   Kamu tidak perlu punya Mac: repo publik dapat menit macOS gratis.
#
# Tiga job:
#   patches  (ubuntu-latest)  — verifikasi patch 0001..0009 apply bersih ke
#                               source XNU pristine. Cepat, tanpa macOS.
#                               Ini yang menangkap patch rusak lebih dulu.
#   kernel   (macos-latest)   — build kernel ARM64 sungguhan (mach.* TISSOT).
#   package  (ubuntu-latest)  — rakit prebuilt/tissot-boot.img dari kernel
#                               hasil job `kernel`. Python saja, tanpa macOS.
#
# Artefak yang bisa diunduh dari tab Actions:
#   xnu-tissot-kernel  mach.* TISSOT (kernel mentah) + kernel.gz
#   tissot-boot        prebuilt/tissot-boot.img  <- ini yang di-fastboot
#   build-log          build.log lengkap
# ============================================================================

on:
  # Build XNU butuh Mach-O: xcrun, ld64, ctf_insert, kextsymboltool, SDK
  # iPhoneOS. Itu semua biner macOS, jadi runner macOS-lah yang dipakai —
  # build di WSL/Linux tidak bisa menyelesaikan tahap kompilasi.
  push:
    paths:
      - "xnu/patches-8020/**"
      - "xnu/apply-8020.sh"
      - "xnu-build-arm64.sh"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/xnu-tissot.yml"
  workflow_dispatch:
    inputs:
      config:
        description: "Kernel config"
        required: true
        default: DEVELOPMENT
        type: choice
        options:
          - DEVELOPMENT
          - RELEASE
          - DEBUG
      pack:
        description: "Rakit boot image setelah kernel jadi"
        required: true
        default: true
        type: boolean
# Satu build pada satu waktu per ref; push baru membatalkan yang lama.
concurrency:
  group: xnu-tissot-${{ github.ref }}
  cancel-in-progress: true

env:
  XNU_TAG: xnu-8020.140.41

jobs:
  # --------------------------------------------------------------------------
  # Job 1 — verifikasi patch series (Linux, tanpa macOS)
  #
  # Mengunduh xnu-8020.140.41, menerapkan 0001..0010 berurutan, lalu memastikan
  # setiap penanda patch benar-benar ada. Kalau ada yang gagal di sini, build
  # kernel di job 2 pasti juga gagal — jadi ini gerbang cepat.
  # --------------------------------------------------------------------------
  patches:
    name: "Verifikasi patch series (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache source XNU
        uses: actions/cache@v4
        with:
          path: xnu-deps/build
          key: xnu-src-${{ env.XNU_TAG }}-v1

      - name: Terapkan patch ke source XNU pristine
        run: |
          chmod +x xnu/apply-8020.sh xnu-build-arm64.sh
          ./xnu/apply-8020.sh

      - name: Cek penanda tiap patch
        run: |
          set -e
          SRC=xnu-src-8020
          check() {
            if grep -q "$2" "$SRC/$1"; then
              echo "  ok    $1 :: $2"
            else
              echo "  MISS  $1 :: $2"
              exit 1
            fi
          }
          echo "--- patch 0001: board config TISSOT ---"
          test -f "$SRC/pexpert/pexpert/arm64/TISSOT.h"
          check makedefs/MakeInc.def                 MACHINE_FLAGS_ARM64_TISSOT
          check pexpert/pexpert/arm64/board_config.h ARM64_BOARD_CONFIG_TISSOT
          echo "--- patch 0002: UART console ---"
          check pexpert/pexpert/arm/protos.h         SERIAL_TISSOT_UART
          check pexpert/arm/pe_serial.c              tissot_uart_init
          echo "--- patch 0003: GICv2 ---"
          check pexpert/pexpert/arm64/TISSOT.h       TISSOT_GIC_V2
          check pexpert/arm/pe_fiq.c                 tissot_gic_init_distributor
          check pexpert/arm/pe_fiq.c                 pe_gic_ack_irq
          check osfmk/arm64/sleh.c                   pe_gic_ack_irq
          echo "--- patch 0004: availability.pl dari SDK host ---"
          check bsd/sys/make_symbol_aliasing.sh      HAKIOS_HOST_SDK
          check bsd/sys/make_symbol_aliasing.sh      HAKIOS_STATIC_LIST
          echo "--- patch 0005: kompatibilitas clang baru ---"
          check makedefs/MakeInc.def                 Wno-missing-include-dirs
          check makedefs/MakeInc.def                 Not every SDK ships usr/local/include/kernel
          echo "--- patch 0006: warning clang baru ---"
          check makedefs/MakeInc.def                 Wno-reserved-identifier
          echo "--- patch 0007: ekspor TISSOT.h ---"
          check pexpert/pexpert/arm64/Makefile       TISSOT.h
          echo "--- patch 0008: CPU type Cortex-A53 ---"
          check osfmk/arm/proc_reg.h                 ARM64_BOARD_CONFIG_TISSOT
          check iokit/Kernel/IOStartIOKit.cpp        '!defined(ARM64_BOARD_CONFIG_TISSOT)'
          echo "--- patch 0009: backport UIO_STACKBUF + IORPC.kernelContent ---"
          check bsd/sys/uio_internal.h               'UIO_STACKBUF(name, niov)'
          check bsd/dev/vn/vn.c                      'UIO_STACKBUF(uio_buf, 1)'
          check iokit/IOKit/IORPC.h                  kernelContent
          check iokit/DriverKit/IORPC.h              kernelContent
          echo "--- patch 0010: firehose header + bool fix ---"
          test -f "$SRC/libkern/os/firehose_buffer_private.h"
          check libkern/os/firehose_buffer_private.h __firehose_buffer_tracepoint_reserve
          echo "--- patch 0011: firehose header di EXTERNAL_HEADERS ---"
          test -f "$SRC/EXTERNAL_HEADERS/os/firehose_buffer_private.h"
          check EXTERNAL_HEADERS/os/firehose_buffer_private.h __firehose_buffer_tracepoint_reserve
          echo "--- patch 0012: flag platform linker ios ---"
          check makedefs/MakeInc.def 'DEPLOYMENT_LINKER_FLAGS)'
          echo "--- patch 0013: flag platform di LTO merge ---"
          check makedefs/MakeInc.def 'inline-threshold=100 $(DEPLOYMENT_LINKER_FLAGS)'
          echo "--- patch 0014: -target ios di link ---"
          check makedefs/MakeInc.def 'arm64-apple-ios15.0'
          if grep -q 'enable-trivial-auto-var-init-zero' "$SRC/makedefs/MakeInc.def"; then
            echo '  FAIL  flag clang lama masih ada'; exit 1
          fi
          echo '  ok    flag clang lama sudah dibuang'
          echo ""
          echo "Semua penanda patch ada."

      - name: Cek TISSOT tidak memakai arm64e (PAC)
        run: |
          # Cortex-A53 tidak punya Pointer Authentication. Kalau TISSOT masih
          # dipetakan ke arm64e, kernel tidak akan jalan di Mi A1.
          python3 - <<'PY'
          import re, sys
          src = open("xnu-src-8020/makedefs/MakeInc.def").read()
          m = re.search(
              r"ifneq\s*\(\$\(filter TISSOT,\$\(CURRENT_MACHINE_CONFIG\)\),\)\s*\n(.*?)\nelse",
              src, re.S)
          if not m:
              sys.exit("GAGAL: blok TISSOT arm64/arm64e tidak ditemukan")
          if "ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG := arm64" not in m.group(1):
              sys.exit("GAGAL: TISSOT tidak di-set ke arm64 "
                       "(masih arm64e -> PAC, A53 akan fault)")
          print("ok: TISSOT -> arm64 (bukan arm64e)")
          PY

      - name: Cek -mcpu=cortex-a53
        run: |
          grep -E "MACHINE_FLAGS_ARM64_TISSOT[[:space:]]*=[[:space:]]*-DARM64_BOARD_CONFIG_TISSOT[[:space:]]+-mcpu=cortex-a53" \
            xnu-src-8020/makedefs/MakeInc.def \
            || { echo "GAGAL: MACHINE_FLAGS_ARM64_TISSOT bukan -mcpu=cortex-a53"; exit 1; }
          echo "ok: -mcpu=cortex-a53"

      - name: Cek pipeline image (tanpa compiler)
        run: |
          # DTB + kernel placeholder + boot image harus bisa dirakit murni
          # dengan Python. Kalau ini gagal, job `package` juga akan gagal.
          set -e
          python3 tools/build_tissot_dtb.py
          python3 tools/build_kernel_placeholder_arm64.py
          python3 tools/make_tissot_bootimg.py --adt ""
          echo "ok: boot image placeholder terpaket"

          # ADT adalah data Apple (dari IPSW milik sendiri), TIDAK di-commit.
          # Jadi langkah ADT hanya jalan kalau file-nya ada.
          ADT=devices/tissot/dt/d22ap_15.6.1.adt
          if [ -f "$ADT" ]; then
            python3 tools/mkadt.py --template "$ADT" --tissot \
              --out prebuilt/tissot.adt
            python3 tools/make_tissot_bootimg.py
            echo "ok: ADT + boot image lengkap"
          else
            echo "::notice::$ADT tidak ada di repo (data Apple tidak didistribusikan) — audit ADT dilewati. Jalankan devices/tissot/extract-dt.sh dari IPSW sendiri untuk mengaktifkannya."
          fi

      # Boot image placeholder sengaja diunggah: ini yang bisa dipakai untuk
      # menguji jalur fastboot + ABL hari ini, tanpa menunggu build kernel
      # berhasil. Isinya `wfi` spin loop, jadi tidak akan boot — tapi kalau
      # ABL menolak imagenya, itu masalah packing, bukan masalah XNU.
      - name: Upload boot image placeholder
        uses: actions/upload-artifact@v4
        with:
          name: tissot-boot-placeholder
          path: prebuilt/tissot-boot.img
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # Job 2 — build kernel sungguhan
  #
  # Butuh macOS: clang + cctools + SDK Apple (lihat catatan di atas).
  # --------------------------------------------------------------------------
  kernel:
    name: "Build kernel (macOS runner)"
    runs-on: macos-latest
    needs: patches
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache source XNU
        uses: actions/cache@v4
        with:
          path: xnu-deps/build
          key: xnu-src-${{ env.XNU_TAG }}-v1

      # Toolchain di runner macOS selalu ada, tapi versinya berbeda-beda dan
      # XNU 8020 (2021) lebih tua dari Xcode yang terpasang. Laporan ini yang
      # membuat kegagalan build nanti bisa dibaca: kalau error-nya soal
      # "-Wno-..." yang tidak dikenal clang baru, itu penyebabnya.
      - name: Laporkan toolchain host
        run: |
          echo "host   : $(uname -a)"
          echo "xcode  : $(xcodebuild -version | tr '\n' ' ')"
          echo "clang  : $(clang --version | head -1)"
          echo "sdk    : $(xcrun -sdk iphoneos -show-sdk-path 2>/dev/null || echo '-')"
          echo ""
          for t in clang ld ctf_insert kextsymboltool make python3; do
            printf '%-16s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"
          done
          echo ""
          echo "--- ld versi ---"
          ld -v 2>&1 | head -3 || true
          echo "--- SDK iPhoneOS ---"
          xcrun -sdk iphoneos -show-sdk-version 2>/dev/null || true
          SDK_PATH="$(xcrun -sdk iphoneos -show-sdk-path 2>/dev/null || true)"
          echo "sdk path : $SDK_PATH"
          echo "platform : $(xcrun -sdk iphoneos -show-sdk-platform-path 2>/dev/null || true)"
          # bsd/sys/make_symbol_aliasing.sh memakai ini; kalau tidak ada,
          # build mati di _symbol_aliasing.h dengan error yang membingungkan.
          if [ -x "$SDK_PATH/usr/local/libexec/availability.pl" ]; then
            echo "availability.pl : ok"
          else
            LISTING="$(ls "$SDK_PATH/usr/local/libexec" 2>&1 | tr '\n' ' ' | cut -c1-200)"
            echo "availability.pl : MISSING (patch 0004 -> daftar versi bawaan)"
            echo "isi usr/local/libexec: ${LISTING:-<kosong/tidak ada>}"
            echo "::warning::availability.pl tidak ada di SDK iPhoneOS — BUKAN blocker: patch 0004 memakai daftar versi bawaan. Isi usr/local/libexec: ${LISTING:-<kosong/tidak ada>}"
          fi

          # Cari di mana availability.pl sebenarnya berada di mesin ini.
          # XNU mengharapkannya di \$SDK/usr/local/libexec/, tapi SDK iOS
          # tidak mengirim direktori itu, dan SDK macOS pun belum tentu.
          echo "--- mencari availability.pl ---"
          HOST_SDK="$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)"
          echo "host sdk : $HOST_SDK"
          echo "dev dir  : $(xcode-select -p 2>/dev/null || echo '-')"
          for p in "$HOST_SDK/usr/local/libexec/availability.pl" \
                   "$(xcode-select -p 2>/dev/null)/usr/local/libexec/availability.pl" \
                   /usr/local/libexec/availability.pl; do
            if [ -x "$p" ]; then echo "  FOUND $p"; else echo "  tidak ada: $p"; fi
          done
          echo "  hasil find:"
          FOUND_LIST="$(find /Applications/Xcode*.app /Library/Developer /usr/local \
               -name availability.pl 2>/dev/null | head -3 | tr '\n' ' ')"
          echo "  ${FOUND_LIST:-<tidak ditemukan>}"
          echo "::notice::probe availability.pl | host_sdk=${HOST_SDK:-<kosong>} | ditemukan: ${FOUND_LIST:-<tidak ada di mana pun>}"

      - name: Siapkan source + patch
        run: |
          chmod +x xnu/apply-8020.sh xnu-build-arm64.sh
          ./xnu/apply-8020.sh

      # Build dibuat tidak menggagalkan job di sini, supaya langkah ringkasan
      # dan upload artefak di bawah tetap jalan. Status akhirnya ditentukan
      # oleh langkah "Nilai hasil build" di paling bawah.
      - name: Build kernel (ARM64 TISSOT)
        id: build
        continue-on-error: true
        run: |
          CONFIG="${{ github.event.inputs.config || 'DEVELOPMENT' }}"
          echo "config=$CONFIG" >> "$GITHUB_ENV"
          set +e

          # Dua knob sekaligus:
          #
          # BUILD_WERROR=0  XNU 8020 (2021) + clang 26: -Weverything membuat
          #                 warning baru, dan -Werror mengubahnya jadi error
          #                 yang menutupi error asli. BUILD_WERROR=0 adalah
          #                 knob resmi XNU untuk itu.
          #
          # -k              make lanjut ke file lain setelah satu file gagal.
          #                 Tanpa ini satu run cuma memperlihatkan satu file
          #                 bermasalah; dengan ini seluruh daftar error
          #                 keluar sekali jalan.
          #
          # Dulu ada percobaan kedua dengan --no-werror setelah percobaan
          # pertama gagal karena -Werror. Sekarang percobaan pertama sudah
          # memakai --no-werror, jadi tidak perlu diulang.
          ./xnu-build-arm64.sh --force --config "$CONFIG" --jobs 4 \
              --no-werror --keep-going 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo ">>> exit code: $rc"
          exit 0

      - name: Cari kernel hasil build
        id: find
        if: always()
        run: |
          echo "--- BUILD/obj ---"
          find xnu-src-8020/BUILD -maxdepth 3 -type f \( -name 'kernel.*' -o -name '*.dSYM' \) 2>/dev/null || true
          K="$(find xnu-src-8020/BUILD -type f -name 'kernel.*' 2>/dev/null | head -1)"
          if [ -n "$K" ]; then
            echo "found=$K"
            echo "found=$K" >> "$GITHUB_OUTPUT"
            ls -l "$K"
            file "$K" || true
            mkdir -p prebuilt
            cp "$K" prebuilt/tissot-kernel-arm64.Image
            gzip -9 -c "$K" > prebuilt/tissot-kernel-arm64.Image.gz
            echo "size=$(wc -c < "$K")" >> "$GITHUB_OUTPUT"
          else
            echo "kernel.* tidak ditemukan"
          fi

      - name: 40 error pertama
        if: always()
        run: |
          # Kalau ada percobaan kedua (BUILD_WERROR=0), itulah yang menentukan
          # hasil akhir — percobaan pertama bisa gagal hanya karena -Werror.
          # Membaca build.log saja akan menampilkan error yang sudah tidak
          # relevan.
          LOG=build.log
          if [ -s build-retry.log ]; then
            LOG=build-retry.log
            echo ">>> membaca percobaan kedua: $LOG"
          fi
          # Hanya diagnostik compiler SEJATI: path:line:col: error: ...
          # `grep "error:"` polos ikut menangkap baris source yang memuat kata
          # "error:" di dalam string (netem/IOLog/kcdata), sehingga error asli
          # tertutup noise. Pola ini butuh prefix file:baris:kolom.
          ERR=':[0-9]+:[0-9]+: (fatal )?error:'
          echo "=== error (diagnostik sejati) ==="
          grep -n -E "$ERR" "$LOG" 2>/dev/null | head -40 || true
          echo ""
          echo "=== 30 baris terakhir ==="
          tail -30 "$LOG" 2>/dev/null || true

          # Anotasi: kalau build gagal, konteks error dipancarkan sebagai
          # ::error:: supaya kelihatan di tab Checks tanpa perlu login untuk
          # mengunduh artefak.
          #
          # Dua lapis:
          #   1. error PERTAMA + 2 baris konteks — ini akar masalahnya.
          #   2. semua error yang BERBEDA (dedup per pesan, maks 25) — supaya
          #      satu run memperlihatkan seluruh daftar masalah, bukan satu
          #      per run. Nomor baris tetap ikut supaya bisa ditelusuri.
          if [ -s "$LOG" ]; then
            first="$(grep -n -m1 -E "$ERR" "$LOG" | cut -d: -f1)"
            if [ -n "$first" ]; then
              echo "::error::=== AKAR MASALAH (error pertama, baris $first) ==="
              end=$((first + 2))
              sed -n "${first},${end}p" "$LOG" | while IFS= read -r l; do
                [ -n "$l" ] || continue
                echo "::error::$(printf '%s' "$l" | cut -c1-280)"
              done

              n_all="$(grep -c -E "$ERR" "$LOG" || true)"
              n_uniq="$(grep -E "$ERR" "$LOG" | awk '
                { msg = $0; sub(/^.*error:[[:space:]]*/, "", msg) }
                !seen[msg]++ { c++ }
                END { print c + 0 }')"
              echo "::error::=== RINGKASAN: ${n_all} baris error, ${n_uniq} pesan berbeda ==="

              if [ "${n_uniq:-0}" -gt 1 ]; then
                echo "::error::=== SEMUA PESAN ERROR YANG BERBEDA ==="
                grep -E "$ERR" "$LOG" | awk '
                  { msg = $0; sub(/^.*error:[[:space:]]*/, "", msg) }
                  !seen[msg]++ { print }
                ' | head -25 | while IFS= read -r l; do
                  echo "::error::$(printf '%s' "$l" | cut -c1-280)"
                done
              fi
            else
              mk="$(grep -n -m1 -E "make(\[[0-9]+\])?: \*\*\*" "$LOG" | cut -d: -f1)"
              if [ -n "$mk" ]; then
                start=$((mk - 3))
                [ "$start" -lt 1 ] && start=1
                sed -n "${start},${mk}p" "$LOG" | while IFS= read -r l; do
                  [ -n "$l" ] || continue
                  echo "::error::$(printf '%s' "$l" | cut -c1-280)"
                done
              else
                grep -v '^[[:space:]]*$' "$LOG" | tail -3 | while IFS= read -r l; do
                  echo "::error::$(printf '%s' "$l" | cut -c1-280)"
                done
              fi
            fi
          fi

          # Ringkasan ke $GITHUB_STEP_SUMMARY.
          #
          # Anotasi dibatasi GitHub (10 per step), jadi daftar error yang
          # panjang akan terpotong. Summary di halaman run bisa dibuka tanpa
          # login, sedangkan log mentah dan artefak tidak — jadi daftar penuh
          # ditulis ke sini.
          if [ -s "$LOG" ]; then
            {
              echo "### Error unik dari build"
              echo ""
              echo '```'
              grep -E "$ERR" "$LOG" | awk '
                { msg = $0; sub(/^.*error:[[:space:]]*/, "", msg) }
                !seen[msg]++ { print }
              ' | head -40 | cut -c1-240
              echo '```'
              echo ""
              echo "<details><summary>30 baris terakhir log</summary>"
              echo ""
              echo '```'
              tail -30 "$LOG" | cut -c1-240
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnosa link (platform objek)
        if: always()
        run: |
          # Cepat: hanya objek di folder build. JANGAN find /Applications
          # (Xcode.app ratusan ribu file -> step menggantung).
          OBJROOT="xnu-src-8020/BUILD/obj/DEVELOPMENT_ARM64_TISSOT"
          OBJPLAT=""
          for n in version.o nonlto.o justlto.tmp.o; do
            p="$(find "$OBJROOT" -name "$n" 2>/dev/null | head -1)"
            if [ -n "$p" ]; then
              pl="$(vtool -show-build "$p" 2>/dev/null | grep -E 'platform' | head -1 | tr -s ' ')"
              OBJPLAT="$OBJPLAT ${n}=[${pl:-none}]"
            else
              OBJPLAT="$OBJPLAT ${n}=[missing]"
            fi
          done
          echo "objplat:$OBJPLAT"
          echo "=== error platform di log ==="
          grep -n -E "incompatible platforms|building for macOS" build.log 2>/dev/null | head -3 || true
          echo "::notice::objplat${OBJPLAT}"

      - name: Ringkasan job
        if: always()
        run: |
          {
            echo "## XNU 8020 → Mi A1 (tissot)"
            echo ""
            echo "| Item | Nilai |"
            echo "|------|-------|"
            echo "| config | \`${{ github.event.inputs.config || 'DEVELOPMENT' }}\` |"
            echo "| target | ARM64 / TISSOT / Cortex-A53 |"
            echo "| exit code build | \`${{ steps.build.outputs.rc }}\` |"
            echo "| kernel | \`${{ steps.find.outputs.found || 'tidak ada' }}\` |"
            if [ -n "${{ steps.find.outputs.size }}" ]; then
              echo "| ukuran kernel | ${{ steps.find.outputs.size }} byte |"
            fi
            echo ""
            echo "Log lengkap ada di artefak \`build-log\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build-retry.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-tissot-kernel
          path: |
            prebuilt/tissot-kernel-arm64.Image
            prebuilt/tissot-kernel-arm64.Image.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Nilai hasil build
        run: |
          rc="${{ steps.build.outputs.rc }}"
          if [ "$rc" != "0" ]; then
            echo "::error::Build kernel gagal (exit $rc). Lihat artefak build-log."
            exit 1
          fi
          if [ -z "${{ steps.find.outputs.found }}" ]; then
            echo "::error::Build sukses tapi kernel.* tidak ditemukan."
            exit 1
          fi
          echo "Build OK."

  # --------------------------------------------------------------------------
  # Job 3 — rakit boot image dari kernel hasil job 2
  #
  # Murni Python (mkadt + dtb + mkbootimg), jadi cukup Linux.
  # --------------------------------------------------------------------------
  package:
    name: "Rakit boot image (Linux)"
    runs-on: ubuntu-latest
    needs: kernel
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.pack }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ambil kernel hasil build
        uses: actions/download-artifact@v4
        with:
          name: xnu-tissot-kernel
          path: prebuilt

      - name: Pasang kernel + rakit boot image
        run: |
          set -e
          ls -l prebuilt
          if [ ! -f prebuilt/tissot-kernel-arm64.Image ]; then
            echo "::error::Kernel hasil build tidak ada di artefak."
            exit 1
          fi
          python3 tools/build_tissot_dtb.py

          # ADT = data Apple dari IPSW sendiri; tidak di-commit ke repo.
          ADT=devices/tissot/dt/d22ap_15.6.1.adt
          if [ -f "$ADT" ]; then
            python3 tools/mkadt.py --template "$ADT" --tissot \
              --out prebuilt/tissot.adt
            echo "ADT: dirakit dari $ADT"
          else
            echo "::warning::ADT tidak ada — boot image dibuat TANPA device tree, jadi belum bisa di-boot XNU."
          fi

          # Kernel XNU adalah Mach-O, bukan arm64 Image, jadi butuh flag ini.
          python3 tools/make_tissot_bootimg.py --allow-foreign-kernel

      - name: Ringkasan boot image
        run: |
          {
            echo ""
            echo "### Boot image"
            echo ""
            if [ -f prebuilt/tissot-boot.img ]; then
              echo "- \`prebuilt/tissot-boot.img\` — $(wc -c < prebuilt/tissot-boot.img) byte"
            else
              echo "- **gagal dirakit**"
            fi
            if [ -f prebuilt/tissot.adt ]; then
              echo "- ADT: $(wc -c < prebuilt/tissot.adt) byte (tertanam)"
            else
              echo "- ADT: **tidak ada** — image belum bisa boot"
            fi
            echo ""
            echo "> Kernel di dalamnya masih Mach-O. ABL melompat ke offset 0"
            echo "> payload, dan header Mach-O bukan kode — jadi flashing sekarang"
            echo "> belum akan boot. Itu tugas SHIM berikutnya."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: tissot-boot
          path: |
            prebuilt/tissot-boot.img
            prebuilt/tissot.adt
            prebuilt/tissot.dtb
          retention-days: 30
