name: HakiOS-x86 Bootable Image

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: 'Kernel config (DEVELOPMENT/RELEASE/DEBUG)'
        required: false
        default: 'DEVELOPMENT'
        type: choice
        options:
          - DEVELOPMENT
          - RELEASE
          - DEBUG
  push:
    branches: [ main, master ]
    paths:
      - 'xnu/**'
      - 'xnuloader/**'
      - 'tools/**'
      - '.github/workflows/image.yml'

jobs:
  build-image:
    name: Build HakiOS-x86 Rufus Image
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          brew install bash cctools lz4 2>/dev/null || true
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      # ---- Step 1: Build real XNU kernel ----
      - name: Clone + patch + build XNU
        run: |
          XNU_VERSION="8796.121.2"
          git clone --depth 1 --branch "xnu-${XNU_VERSION}" https://github.com/apple/darwin-xnu.git xnu-src || \
          git clone --depth 1 https://github.com/apple/darwin-xnu.git xnu-src
          cd xnu-src
          git apply ../xnu/hakios-x86.patch || git apply --3way ../xnu/hakios-x86.patch
          cp -rv ../xnu/files/* ./ 2>/dev/null || true
          cat > config/hakios.x86_64 << 'EOF'
          PLATFORM_NAME := hakios
          ARCH_CONFIG := X86_64
          KERNEL_CONFIGS := DEVELOPMENT RELEASE DEBUG
          CFLAGS_HAKIOS := -DHAKIOS_X86 -DHAKIOS_PLATFORM -DHAKIOS_Q35
          HAKIOS_DRIVER_SRCS := \
              bsd/dev/hakios.display.c bsd/dev/hakios.input.c bsd/dev/hakios.disk.c \
              bsd/dev/hakios.net.c bsd/dev/hakios.audio.c bsd/dev/hakios.timer.c \
              bsd/dev/hakios.serial.c bsd/dev/hakios.pci.c bsd/dev/hakios.platform.c
          C_SOURCE_OBJS += $(HAKIOS_DRIVER_SRCS:.c=.o)
          CFLAGS_HAKIOS += -I$(SRCROOT)/bsd/dev
          PLATFORM_EXPERT := hakios_platform
          LDFLAGS_HAKIOS := -DHAKIOS_X86
          export CFLAGS_HAKIOS LDFLAGS_HAKIOS
          EOF
          KERNEL_CONFIG="${{ github.event.inputs.kernel_config || 'DEVELOPMENT' }}"
          make ARCH_CONFIGS=X86_64 KERNEL_CONFIGS="$KERNEL_CONFIG" TARGET_CONFIGS=hakios \
            SDKROOT="$(xcrun --show-sdk-path)" 2>&1 | tail -30 || {
            make ARCH_CONFIGS=X86_64 KERNEL_CONFIGS="$KERNEL_CONFIG" SDKROOT="$(xcrun --show-sdk-path)" exporthdrs 2>&1 | tail -10
            make ARCH_CONFIGS=X86_64 KERNEL_CONFIGS="$KERNEL_CONFIG" SDKROOT="$(xcrun --show-sdk-path)" all 2>&1 | tail -30
          }

      - name: Copy kernel to prebuilt
        run: |
          KERNEL_CONFIG="${{ github.event.inputs.kernel_config || 'DEVELOPMENT' }}"
          KERNEL_FILE=$(find xnu-src -name "mach.${KERNEL_CONFIG}*" -type f 2>/dev/null | head -1)
          mkdir -p prebuilt
          if [ -n "$KERNEL_FILE" ]; then
            cp "$KERNEL_FILE" "prebuilt/mach.${KERNEL_CONFIG}.x86_64"
            echo ">>> Real kernel copied: $KERNEL_FILE"
          else
            echo ">>> WARNING: real kernel not found. Using placeholder."
            python3 tools/build_kernel_placeholder.py
          fi

      # ---- Step 2: Build UEFI loader (Python, no clang needed) ----
      - name: Build xnuloader.efi
        run: python3 xnuloader/build_efi.py

      # ---- Step 3: Create Rufus image ----
      - name: Create Rufus image
        run: python3 tools/make_rufus_img.py

      - name: Verify image
        run: |
          ls -la prebuilt/hakios-x86.img
          file prebuilt/hakios-x86.img || true

      - name: Upload complete image
        uses: actions/upload-artifact@v4
        with:
          name: hakios-x86-image-${{ github.event.inputs.kernel_config || 'DEVELOPMENT' }}
          path: |
            prebuilt/hakios-x86.img
            prebuilt/mach.*.x86_64
            prebuilt/xnuloader.efi
          if-no-files-found: warn
