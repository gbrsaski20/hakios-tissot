name: XNU Kernel Build (x86_64)

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: 'Kernel config (DEVELOPMENT/RELEASE/DEBUG)'
        required: false
        default: 'DEVELOPMENT'
        type: choice
        options:
          - DEVELOPMENT
          - RELEASE
          - DEBUG
  push:
    branches: [ main, master ]
    paths:
      - 'xnu/**'
      - '.github/workflows/xnu.yml'

jobs:
  build-xnu:
    name: Build XNU x86_64 (HakiOS)
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install cctools lz4 2>/dev/null || true
          # XNU needs bash 4+ for its build scripts
          brew install bash 2>/dev/null || true
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Clone Apple XNU source
        run: |
          XNU_VERSION="8796.121.2"
          XNU_REPO="https://github.com/apple/darwin-xnu.git"
          XNU_BRANCH="xnu-${XNU_VERSION}"
          echo ">>> Cloning XNU ${XNU_VERSION}..."
          git clone --depth 1 --branch "$XNU_BRANCH" "$XNU_REPO" xnu-src || \
          git clone --depth 1 "$XNU_REPO" xnu-src
          echo ">>> XNU cloned."

      - name: Apply HakiOS-x86 patch
        run: |
          cd xnu-src
          git checkout -- . 2>/dev/null || true
          git apply ../xnu/hakios-x86.patch || git apply --3way ../xnu/hakios-x86.patch
          echo ">>> Patch applied."
          # Copy driver files
          cp -rv ../xnu/files/* ./ 2>/dev/null || true
          # Create target config
          cat > config/hakios.x86_64 << 'EOF'
          PLATFORM_NAME := hakios
          ARCH_CONFIG := X86_64
          KERNEL_CONFIGS := DEVELOPMENT RELEASE DEBUG
          CFLAGS_HAKIOS := -DHAKIOS_X86 -DHAKIOS_PLATFORM -DHAKIOS_Q35
          HAKIOS_DRIVER_SRCS := \
              bsd/dev/hakios.display.c \
              bsd/dev/hakios.input.c \
              bsd/dev/hakios.disk.c \
              bsd/dev/hakios.net.c \
              bsd/dev/hakios.audio.c \
              bsd/dev/hakios.timer.c \
              bsd/dev/hakios.serial.c \
              bsd/dev/hakios.pci.c \
              bsd/dev/hakios.platform.c
          C_SOURCE_OBJS += $(HAKIOS_DRIVER_SRCS:.c=.o)
          CFLAGS_HAKIOS += -I$(SRCROOT)/bsd/dev
          PLATFORM_EXPERT := hakios_platform
          LDFLAGS_HAKIOS := -DHAKIOS_X86
          export CFLAGS_HAKIOS LDFLAGS_HAKIOS
          EOF

      - name: Build XNU for x86_64
        run: |
          cd xnu-src
          KERNEL_CONFIG="${{ github.event.inputs.kernel_config || 'DEVELOPMENT' }}"
          # XNU's build system uses make with ARCH_CONFIGS / TARGET_CONFIGS
          # On macOS we have the SDK natively (no cctools/SDK hacks needed)
          make ARCH_CONFIGS=X86_64 KERNEL_CONFIGS="$KERNEL_CONFIG" TARGET_CONFIGS=hakios \
            SDKROOT="$(xcrun --show-sdk-path)" 2>&1 | tail -50 || {
            echo ">>> Full build failed, trying exporthdrs + all..."
            make ARCH_CONFIGS=X86_64 KERNEL_CONFIGS="$KERNEL_CONFIG" SDKROOT="$(xcrun --show-sdk-path)" exporthdrs 2>&1 | tail -20
            make ARCH_CONFIGS=X86_64 KERNEL_CONFIGS="$KERNEL_CONFIG" SDKROOT="$(xcrun --show-sdk-path)" all 2>&1 | tail -50
          }

      - name: Find and copy kernel
        run: |
          KERNEL_FILE=$(find xnu-src -name "mach.${KERNEL_CONFIG:-DEVELOPMENT}*" -type f 2>/dev/null | head -1)
          if [ -n "$KERNEL_FILE" ]; then
            mkdir -p prebuilt
            cp "$KERNEL_FILE" "prebuilt/mach.${KERNEL_CONFIG:-DEVELOPMENT}.x86_64"
            echo ">>> Kernel: $KERNEL_FILE -> prebuilt/"
            ls -la "prebuilt/mach.${KERNEL_CONFIG:-DEVELOPMENT}.x86_64"
          else
            echo ">>> WARNING: kernel not found. Build may have failed."
            find xnu-src -name "mach*" -type f 2>/dev/null | head
          fi

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-${{ github.event.inputs.kernel_config || 'DEVELOPMENT' }}
          path: prebuilt/mach.*.x86_64
          if-no-files-found: warn
